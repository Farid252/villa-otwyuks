<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#0e7a55;--o2:#0a5c40;--d:#0b3d2e;--d2:#10593f;--bg:#eef5f0;--c:#fff;--l:#d9e6dd;--t:#13241b;--m:#567065;--r:16px;--g:#0e7a55;--x:#b3543f;--sage:#dcebe1}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
h1,h2,aside .bn{font-family:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif}
button,input,textarea{font:inherit}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 480px at 18% 0%,rgba(21,122,85,.55),transparent 60%),linear-gradient(150deg,#0b3d2e,#0f766e)}
.lbox{background:#fff;border-radius:22px;padding:34px;width:min(440px,100%);box-shadow:0 30px 70px rgba(0,0,0,.45)}
.lbox h1{margin:0 0 20px;font-size:1.5rem;font-weight:800}.lbox p{margin:0 0 18px;color:var(--m);font-size:.93rem}
.logo{display:inline-flex;align-items:center;gap:8px;background:var(--o);color:#fff;font-weight:700;border-radius:12px;padding:7px 14px;margin-bottom:16px}
/* layout */
#app{display:flex;min-height:100vh}
aside{width:264px;background:linear-gradient(180deg,#0b3d2e,#10593f);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;flex:0 0 264px}
aside .bn{font-weight:800;font-size:1.2rem;padding:0 10px}
aside .bs{color:#a9cfb9;font-size:.8rem;padding:0 10px 18px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#d7e8dd;padding:11px 13px;border-radius:12px;cursor:pointer;text-decoration:none;font-size:.96rem;font-weight:600}
.nav:hover{background:rgba(255,255,255,.10)}.nav.on{background:var(--o);color:#fff;font-weight:700;box-shadow:0 8px 18px rgba(14,122,85,.35)}
.sp{flex:1}
main{flex:1;padding:30px clamp(16px,4vw,44px);max-width:1100px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.01em}.sub{margin:6px 0 0;color:var(--m);max-width:62ch}
.btn{background:var(--o);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(14,122,85,.28)}
.btn:hover{background:var(--o2)}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--t);border:1px solid var(--l);box-shadow:none}.btn.ghost:hover{background:var(--sage)}
.btn.danger{background:#fff;color:var(--x);border:1px solid #efc9c6;box-shadow:none}
.btn.sm{padding:7px 13px;font-size:.88rem}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,.drop:focus-within{outline:3px solid #9fdcc0;outline-offset:2px}
.card{background:var(--c);border:1px solid var(--l);border-radius:var(--r);padding:24px;margin-bottom:20px;box-shadow:0 6px 18px rgba(13,61,46,.06)}
.card h2{margin:0 0 2px;font-size:1.15rem;font-weight:700}.card .d{color:var(--m);font-size:.92rem;margin:0 0 16px}
/* villa grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.vc{background:#fff;border:1px solid var(--l);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(13,61,46,.06)}
.cov{height:150px;background:linear-gradient(135deg,#10664a,#0b3d2e);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#d7e8dd;font-size:.88rem;font-weight:600}
.vb{padding:15px 16px;flex:1}.vb h3{margin:0 0 6px;font-size:1.05rem;font-weight:700}
.bd{display:inline-block;background:var(--sage);color:var(--o2);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700}
.mt{color:var(--m);font-size:.86rem;margin:8px 0 0}.pr{font-weight:800;margin-top:6px;color:var(--o2)}
.va{display:flex;gap:8px;padding:0 16px 16px}
.empty{text-align:center;color:var(--m);padding:40px 10px;border:2px dashed var(--l);border-radius:var(--r)}
/* forms */
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.f{margin-bottom:16px}
.f label{display:block;font-weight:600;margin-bottom:2px}
.f .h{color:var(--m);font-size:.86rem;margin:0 0 6px}
.w{display:inline-block;background:var(--sage);color:var(--o2);border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:700;margin-left:6px;vertical-align:middle}
input[type=text],input[type=number],input[type=password],textarea{width:100%;padding:11px 13px;border:1px solid var(--l);border-radius:12px;background:#fff;color:var(--t)}
input:focus,textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(14,122,85,.12)}
textarea{min-height:96px;resize:vertical}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sage);color:var(--o2);border-radius:999px;padding:5px 7px 5px 13px;font-size:.9rem;font-weight:600}
.chip button{border:0;background:#bfe0cc;color:var(--o2);width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1;font-weight:700}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sug button{background:#fff;border:1px dashed #b9d4c5;border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer;color:var(--m)}
.sug button:hover{border-color:var(--o);color:var(--o2)}
.inl{display:flex;gap:8px}
/* photos */
.drop{display:block;border:2px dashed #9cc8b2;border-radius:var(--r);background:#f3faf6;text-align:center;padding:24px;cursor:pointer;color:var(--o2);font-weight:700}
.drop small{display:block;font-weight:400;color:var(--m);margin-top:2px}
.himg{width:100%;max-height:230px;object-fit:cover;border-radius:12px;display:block;background:#eef5f0}
.calh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;max-width:460px}.calh b{font-size:1.05rem}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:460px}.calg .w{text-align:center;font-size:.78rem;font-weight:700;color:var(--m)}
.calg button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px 0;font:inherit;cursor:pointer;color:var(--t)}
.calg button:hover{border-color:var(--o)}.calg button.full{background:#fde8e3;border-color:#efb5ab;color:var(--x);font-weight:700}.calg button.past{opacity:.45}
.calleg{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem;color:var(--m);margin:12px 0 0}.calleg span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--l);background:#fff}.calleg .f::before{background:#fde8e3;border-color:#efb5ab}

/* animasi halus */
.nav{transition:background-color .25s ease,transform .25s ease}.nav:hover{transform:translateX(4px)}
.btn{transition:transform .2s ease,box-shadow .25s ease,background-color .25s ease,opacity .2s ease}.btn:hover:not(:disabled){transform:translateY(-1px)}
.vc{transition:transform .3s ease,box-shadow .3s ease}.vc:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(13,61,46,.16)}
.chip button,.sug button,.drop,.pi{transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}.drop:hover{background:#e6f4ec;border-color:var(--o)}
.calg button{transition:background-color .2s ease,border-color .2s ease,transform .15s ease}.calg button:active{transform:scale(.94)}
input,textarea{transition:border-color .2s ease,box-shadow .2s ease}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ani .top{animation:fade .35s ease both}
.ani .card,.ani .vc,.ani .empty{animation:up .45s ease both}
.ani .card:nth-of-type(2),.ani .vc:nth-child(2){animation-delay:.05s}.ani .card:nth-of-type(3),.ani .vc:nth-child(3){animation-delay:.1s}.ani .card:nth-of-type(4),.ani .vc:nth-child(4){animation-delay:.15s}.ani .card:nth-of-type(n+5),.ani .vc:nth-child(n+5){animation-delay:.2s}
#toast{transition:opacity .3s ease,transform .3s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.prrow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:10px}.prrow input{margin:0}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:16px}
.pi{border:1px solid var(--l);border-radius:12px;padding:8px;background:#fff}
.pi img{width:100%;height:120px;object-fit:cover;border-radius:10px;display:block;background:#eef5f0}
.pi input{margin:8px 0;padding:7px 10px;font-size:.88rem}
.pb{display:flex;gap:6px;flex-wrap:wrap}
.cv{position:relative}.cv span{position:absolute;top:6px;left:6px;background:var(--o);color:#fff;font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:999px}
.bar{position:sticky;bottom:0;background:rgba(238,245,240,.94);backdrop-filter:blur(6px);padding:14px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--l)}
.bar .n{color:var(--m);font-size:.86rem;flex:1;min-width:200px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--d);color:#fff;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:92vw;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--x)}
.help li{margin-bottom:8px}
.err{color:var(--x);font-size:.9rem;min-height:1.3em;margin:8px 0 0}
@media (max-width:820px){
 #app{flex-direction:column}
 aside{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
 aside .bs{display:none}aside .bn{padding:0 8px 0 4px}.sp{display:none}.nav{width:auto;padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <span class="logo"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 7.5c4.2 3 6.4 7 6.4 10.8a6.4 6.4 0 1 1-12.8 0C9.6 14.5 11.8 10.5 16 7.5z" fill="#fff"/><path d="M16 22.5v-9" stroke="#0e7a55" stroke-width="1.8" stroke-linecap="round"/></svg> Panel Admin</span>
    <h1>Masuk untuk mengelola website</h1>
    <div class="f"><label for="usr">Login User</label><input type="text" id="usr" autocomplete="username" spellcheck="false"></div>
    <div class="f"><label for="tok">Password</label><input type="password" id="tok" autocomplete="off" spellcheck="false"></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:.9rem;margin-bottom:14px"><input type="checkbox" id="rem"> Ingat di browser ini (jangan dicentang di komputer umum)</label>
    <button class="btn" id="lbtn" style="width:100%" onclick="connect()">Masuk</button>
    <p class="err" id="lerr" role="alert"></p>
  </div>
</div>

<div id="app" class="hide">
  <aside>
    <div class="bn" id="sbn">Panel Admin</div>
    <div class="bs">Kelola isi website</div>
    <button class="nav" data-v="villas" onclick="go('villas')">Daftar Villa</button>
    <button class="nav" data-v="settings" onclick="go('settings')">Pengaturan Website</button>
    <button class="nav" data-v="help" onclick="go('help')">Bantuan</button>
    <div class="sp"></div>
    <a class="nav" href="../" target="_blank" rel="noopener">Lihat website</a>
    <button class="nav" onclick="logout()">Keluar</button>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
var REPO="Farid252/villa-otwyuks",ADMIN_USER="admin";
var S={tok:"",repo:"",villas:[],set:{},shaV:"",shaS:"",view:"villas",ed:null,idx:-1,prev:{},dirty:false};
var SUG=["Wi-Fi","AC di semua kamar","Kolam renang","Dapur lengkap","Parkir luas","Area BBQ","Water heater","TV dan Netflix"];
var GROUPS=[
 {t:"Identitas website",d:"Nama dan slogan usaha Anda.",f:[
  {k:"brand",l:"Nama website",h:"Nama usaha Anda.",w:"Logo kiri atas dan judul tab browser"},
  {k:"tagline",l:"Tagline",h:"Kalimat pendek di bawah logo.",w:"Di bawah logo"}]},
 {t:"Halaman depan",d:"Banner besar berlatar gelap yang pertama kali dilihat pengunjung.",f:[
  {k:"hero_title",l:"Judul besar",h:"Kalimat utama untuk menarik pengunjung. Usahakan singkat, di bawah 60 karakter.",w:"Banner paling atas"},
  {k:"hero_text",l:"Teks pendukung",h:"Penjelasan 1-2 kalimat di bawah judul besar.",w:"Di bawah judul besar",long:1},
  {k:"hero_image",l:"Foto latar banner",h:"Foto besar di belakang judul. Pilih foto landscape (melebar) yang terang dan jelas, idealnya lebar 1920 piksel. Foto otomatis dikecilkan agar website cepat. Jika kosong, banner memakai warna coklat bawaan.",w:"Banner paling atas",img:1}]},
 {t:"Bagian Tentang",d:"Perkenalan singkat usaha di bagian bawah halaman.",f:[
  {k:"about_title",l:"Judul bagian Tentang",h:"Judul perkenalan, misalnya keunggulan usaha Anda.",w:"Bagian Tentang"},
  {k:"about_text",l:"Isi perkenalan",h:"Ceritakan usaha Anda dalam 2-3 kalimat.",w:"Bagian Tentang",long:1},
  {k:"manager_name",l:"Nama pengelola",h:"Nama yang tampil di bawah teks perkenalan.",w:"Bagian Tentang"},
  {k:"manager_role",l:"Jabatan pengelola",h:"Contoh: Pemilik, General Manager.",w:"Bagian Tentang"},
  {k:"about_logo",l:"Logo / foto di kotak besar",h:"Logo atau foto yang tampil di kotak besar sebelah kiri bagian Tentang. Logo ditampilkan utuh di tengah kotak. Paling bagus PNG dengan latar transparan. Kotak hijau 10+ Tahun pengalaman tetap ada dan tidak berubah. Jika kosong, kotak besar tetap berwarna hijau gelap.",w:"Kotak besar di bagian Tentang",img:1,up:"upLogo",empty:"Belum ada logo atau foto. Kotak besar tetap berwarna hijau gelap.",bg:"linear-gradient(160deg,#10664a,#0b3d2e)"}]},
 {t:"Kontak pemesanan",d:"Ke mana pesanan dari pengunjung dikirim.",f:[
  {k:"wa",l:"Nomor WhatsApp",h:"Tujuan tombol Pesan lewat WhatsApp. Awali dengan 62, tanpa 0 di depan, tanpa spasi atau tanda +. Contoh: 6281234567890.",w:"Tombol pesan dan footer"},
  {k:"email",l:"Email",h:"Alamat email yang tampil di footer.",w:"Footer"}]}
];

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function dec(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))))}
function rp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
function toast(m,bad){var t=$("#toast");t.textContent=m;t.className="show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=""},4500)}
function api(path,o){o=o||{};return fetch("https://api.github.com/repos/"+S.repo+path,{method:o.method||"GET",cache:"no-store",headers:{"Authorization":"Bearer "+S.tok,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:o.body?JSON.stringify(o.body):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.message||("Error "+r.status));e.status=r.status;throw e}return j})})}
function errMsg(e){if(e.status===401)return"Login User atau Password salah, atau password sudah kedaluwarsa.";if(e.status===404)return"Repository atau file data tidak ditemukan. Cek nama repository dan izin token (Contents: Read and write).";if(e.status===409)return"Data di GitHub sudah berubah (mungkin diedit dari tempat lain). Muat ulang halaman lalu coba lagi.";if(e.status===403)return"Izin token kurang. Pastikan Contents: Read and write.";return e.message||"Terjadi kesalahan."}
function load(){return Promise.all([api("/contents/data/villas.json"),api("/contents/data/settings.json")]).then(function(a){S.shaV=a[0].sha;S.shaS=a[1].sha;S.villas=JSON.parse(dec(a[0].content)).villas||[];S.set=JSON.parse(dec(a[1].content))})}
function put(path,text,sha,msg){var b={message:msg,content:enc(text)};if(sha)b.sha=sha;return api("/contents/"+path,{method:"PUT",body:b}).then(function(r){return r.content.sha})}

/* login */
function guess(){var h=location.hostname.split("."),p=location.pathname.split("/").filter(Boolean);if(/github\.io$/.test(location.hostname)){if(p[0]&&p[0]!=="admin")return h[0]+"/"+p[0];return h[0]+"/"+h[0]+".github.io"}return""}
function connect(auto){
  var usr=$("#usr").value.trim(),tok=$("#tok").value.trim();
  if(!usr||!tok){$("#lerr").textContent="Isi Login User dan Password.";return}
  if(usr.toLowerCase()!==ADMIN_USER.toLowerCase()){$("#lerr").textContent="Login User atau Password salah.";return}
  S.repo=REPO;S.tok=tok;$("#lbtn").disabled=true;$("#lbtn").textContent="Menghubungkan…";$("#lerr").textContent="";
  load().then(function(){
    if(!auto){var st=$("#rem").checked?localStorage:sessionStorage;try{st.setItem("vtok",tok);st.setItem("vusr",usr)}catch(e){}}
    $("#login").classList.add("hide");$("#app").classList.remove("hide");go("villas",1)
  }).catch(function(e){$("#lerr").textContent=errMsg(e);$("#lbtn").disabled=false;$("#lbtn").textContent="Masuk"})
}
function logout(){try{localStorage.removeItem("vtok");sessionStorage.removeItem("vtok")}catch(e){}location.reload()}

/* navigasi */
function go(v,force){
  if(!force&&S.dirty&&!confirm("Ada perubahan yang belum disimpan. Tinggalkan halaman ini?"))return;
  S.dirty=false;S.view=v;render()
}
function render(){
  document.querySelectorAll(".nav[data-v]").forEach(function(b){var on=b.getAttribute("data-v")===S.view||(S.view==="edit"&&b.getAttribute("data-v")==="villas");b.classList.toggle("on",on)});
  $("#sbn").textContent=S.set.brand||"Panel Admin";
  var m=$("#main");
  m.innerHTML=S.view==="villas"?vVillas():S.view==="edit"?vEdit():S.view==="settings"?vSettings():vHelp();
  if(S.view==="edit"){chips();photos();priceRows();calRender()}
  m.classList.remove("ani");void m.offsetWidth;m.classList.add("ani");clearTimeout(render.t);render.t=setTimeout(function(){m.classList.remove("ani")},900);
  window.scrollTo(0,0)
}
function ch(){S.dirty=true}

/* daftar villa */
function vVillas(){
  var h='<div class="top"><div><h1>Daftar Villa</h1><p class="sub">Semua villa yang tampil di website. Klik Ubah untuk mengganti foto, harga, deskripsi, dan fasilitas.</p></div><button class="btn" onclick="newV()">+ Tambah villa</button></div>';
  if(!S.villas.length)return h+'<div class="empty">Belum ada villa. Klik <b>+ Tambah villa</b> untuk mulai.</div>';
  h+='<div class="grid">';
  S.villas.forEach(function(v,i){
    var p=(v.photos||[]).filter(function(x){return x.image}),c=p[0]?'style="background-image:url(\''+esc(S.prev[p[0].image]||("../"+p[0].image))+'\')"':"";
    var pl=vp(v),mn=pl.length?Math.min.apply(null,pl.map(function(x){return+x.price})):0,pj=pl.length>1?'<p class="mt">'+pl.map(function(x){return esc(x.label)+": "+rp(x.price)}).join(" · ")+'</p>':"";
    h+='<div class="vc"><div class="cov" '+c+'>'+(p[0]?"":"Belum ada foto")+'</div><div class="vb"><span class="bd">'+esc(v.category)+'</span><h3>'+esc(v.name)+'</h3><div class="pr">'+(pl.length>1?"Mulai ":"")+rp(mn)+' <small style="font-weight:400;color:var(--m)">/ malam</small></div>'+pj+'<p class="mt">'+p.length+' foto · '+(+v.guests||0)+' tamu · '+(+v.rooms||0)+' kamar</p></div><div class="va"><button class="btn sm" onclick="editV('+i+')">Ubah</button><button class="btn sm danger" onclick="delV('+i+')">Hapus</button></div></div>'
  });
  return h+'</div>'
}
function vp(v){var a=(v.prices||[]).filter(function(x){return+x.price>0});return a.length?a:(+v.price?[{label:"",price:v.price}]:[])}
function newV(){S.cy=null;S.idx=-1;S.ed={name:"",category:"",location:"",guests:2,rooms:1,prices:[{label:"Weekday",price:0},{label:"Weekend",price:0}],description:"",facilities:[],photos:[]};S.dirty=false;S.view="edit";render()}
function editV(i){S.cy=null;S.idx=i;S.ed=JSON.parse(JSON.stringify(S.villas[i]));S.ed.facilities=S.ed.facilities||[];S.ed.photos=S.ed.photos||[];S.ed.prices=S.ed.prices&&S.ed.prices.length?S.ed.prices:(+S.ed.price?[{label:"Per malam",price:+S.ed.price}]:[]);S.dirty=false;S.view="edit";render()}
function delV(i){
  if(!confirm('Hapus villa "'+S.villas[i].name+'" dari website? Tindakan ini tidak bisa dibatalkan dari panel.'))return;
  var old=S.villas.slice();S.villas.splice(i,1);
  saveVillas().then(function(){toast("Villa dihapus.");render()}).catch(function(e){S.villas=old;toast(errMsg(e),1)})
}
function saveVillas(){return put("data/villas.json",JSON.stringify({villas:S.villas},null,2)+"\n",S.shaV,"Update daftar villa via panel admin").then(function(s){S.shaV=s})}

/* edit villa */
function vEdit(){
  var e=S.ed,cats=[];S.villas.forEach(function(v){if(v.category&&cats.indexOf(v.category)<0)cats.push(v.category)});
  return '<div class="top"><div><h1>'+(S.idx<0?"Tambah villa":"Ubah villa")+'</h1><p class="sub">Isi data villa. Semua yang diisi di sini tampil di kartu villa dan jendela detail pada website.</p></div><button class="btn ghost" onclick="go(\'villas\')">← Kembali</button></div>'+
  '<div class="card"><h2>1. Informasi dasar</h2><p class="d">Nama, kategori, dan lokasi villa.</p>'+
  '<div class="f"><label for="n">Nama villa</label><p class="h">Tampil sebagai judul kartu villa.</p><input type="text" id="n" value="'+esc(e.name)+'" oninput="S.ed.name=this.value;ch()"></div>'+
  '<div class="row"><div class="f"><label for="c">Kategori</label><p class="h">Menjadi tombol filter di website. Pilih yang ada atau ketik kategori baru.</p><input type="text" id="c" list="cl" value="'+esc(e.category)+'" oninput="S.ed.category=this.value;ch()"><datalist id="cl">'+cats.map(function(c){return'<option value="'+esc(c)+'">'}).join("")+'</datalist></div>'+
  '<div class="f"><label for="l">Lokasi</label><p class="h">Area atau nama daerah villa.</p><input type="text" id="l" value="'+esc(e.location)+'" oninput="S.ed.location=this.value;ch()"></div></div></div>'+
  '<div class="card"><h2>2. Kapasitas</h2><p class="d">Jumlah tamu dan kamar yang dilihat pengunjung sebelum memesan.</p><div class="row">'+
  '<div class="f"><label for="g">Kapasitas tamu</label><p class="h">Jumlah maksimal tamu.</p><input type="number" id="g" min="0" value="'+(+e.guests||0)+'" oninput="S.ed.guests=+this.value;ch()"></div>'+
  '<div class="f"><label for="k">Jumlah kamar</label><p class="h">Kamar tidur yang tersedia.</p><input type="number" id="k" min="0" value="'+(+e.rooms||0)+'" oninput="S.ed.rooms=+this.value;ch()"></div>'+
  '</div></div>'+
  '<div class="card"><h2>3. Harga per malam</h2><p class="d">Buat kategori harga sesuai kebutuhan, misalnya Weekday dan Weekend. Hari berlakunya Anda tulis sendiri di nama kategori, contoh: Weekend (Jumat-Minggu). Semua kategori tampil di kartu dan jendela detail villa. Isi harga dengan angka saja, tanpa titik.</p><div id="prs"></div><div class="sug"><button onclick="addPr(\'Weekday\')">+ Weekday</button><button onclick="addPr(\'Weekend\')">+ Weekend</button><button onclick="addPr(\'Libur nasional\')">+ Libur nasional</button><button onclick="addPr(\'\')">+ Kategori lain</button></div></div>'+
  '<div class="card"><h2>4. Deskripsi</h2><p class="d">Penjelasan singkat tentang villa. Tampil di jendela detail.</p><textarea id="ds" oninput="S.ed.description=this.value;ch()">'+esc(e.description)+'</textarea></div>'+
  '<div class="card"><h2>5. Fasilitas</h2><p class="d">Ketik satu fasilitas lalu tekan Enter, atau klik saran di bawah. Tampil sebagai daftar di jendela detail.</p>'+
  '<div class="inl"><input type="text" id="fi" placeholder="Contoh: Kolam renang pribadi" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addF()}"><button class="btn" onclick="addF()">Tambah</button></div>'+
  '<div class="sug">'+SUG.map(function(s,i){return'<button onclick="addF(SUG['+i+'])">+ '+esc(s)+'</button>'}).join("")+'</div><div class="chips" id="chips"></div></div>'+
  '<div class="card"><h2>6. Foto villa</h2><p class="d">Foto pertama menjadi foto sampul di kartu villa. Foto otomatis dikecilkan (maksimal 1600 piksel) supaya website tetap cepat.</p>'+
  '<label class="drop">+ Klik untuk menambah foto<small>Boleh pilih beberapa foto sekaligus (JPG, PNG, WebP)</small><input type="file" accept="image/*" multiple hidden onchange="upl(this.files);this.value=\'\'"></label><div class="ph" id="ph"></div></div>'+
  '<div class="card"><h2>7. Kalender ketersediaan</h2><p class="d">Klik tanggal untuk menandai villa ini <b>penuh</b>. Klik sekali lagi untuk mengosongkannya. Tanggal yang sudah lewat dibersihkan otomatis saat disimpan. Pengunjung website melihat kalender ini di jendela detail villa.</p><div id="cal"></div></div>'+
  '<div class="bar"><span class="n">Perubahan baru tampil di website sekitar 1 menit setelah disimpan.</span><button class="btn ghost" onclick="go(\'villas\')">Batal</button><button class="btn" id="sv" onclick="saveV()">Simpan villa</button></div>'
}
function priceRows(){
  var c=$("#prs");if(!c)return;
  c.innerHTML=S.ed.prices.map(function(x,i){return'<div class="prrow"><input type="text" list="pl" aria-label="Nama kategori harga" placeholder="Nama kategori" value="'+esc(x.label)+'" oninput="S.ed.prices['+i+'].label=this.value;ch()"><input type="number" min="0" aria-label="Harga" placeholder="Harga (Rp)" value="'+(+x.price||"")+'" oninput="S.ed.prices['+i+'].price=+this.value;ch()"><button class="btn danger sm" onclick="delPr('+i+')">Hapus</button></div>'}).join("")+'<datalist id="pl"><option value="Weekday"><option value="Weekend"><option value="Libur nasional"><option value="Musim liburan"><option value="Long weekend"></datalist>'
}
function addPr(l){S.ed.prices.push({label:l||"",price:0});ch();priceRows()}
function delPr(i){S.ed.prices.splice(i,1);ch();priceRows()}
function chips(){
  var c=$("#chips");if(!c)return;
  c.innerHTML=S.ed.facilities.length?S.ed.facilities.map(function(f,i){return'<span class="chip">'+esc(f)+'<button aria-label="Hapus '+esc(f)+'" onclick="delF('+i+')">×</button></span>'}).join(""):'<span style="color:var(--m);font-size:.9rem">Belum ada fasilitas. Jika dikosongkan, website memakai fasilitas bawaan kategori.</span>'
}
function addF(t){var i=$("#fi");t=(t||(i&&i.value)||"").trim();if(!t)return;if(S.ed.facilities.indexOf(t)<0)S.ed.facilities.push(t);if(i){i.value="";i.focus()}ch();chips()}
function delF(i){S.ed.facilities.splice(i,1);ch();chips()}
function photos(){
  var h=$("#ph");if(!h)return;
  h.innerHTML=S.ed.photos.map(function(p,i){
    return'<div class="pi"><div class="cv"><img alt="" src="'+esc(S.prev[p.image]||("../"+p.image))+'">'+(i===0?'<span>Sampul</span>':'')+'</div><input type="text" placeholder="Keterangan (mis. Ruang tamu)" value="'+esc(p.caption||"")+'" oninput="S.ed.photos['+i+'].caption=this.value;ch()"><div class="pb">'+(i>0?'<button class="btn ghost sm" onclick="cover('+i+')">Jadikan sampul</button>':'')+'<button class="btn danger sm" onclick="delP('+i+')">Hapus</button></div></div>'
  }).join("")
}
function cover(i){var p=S.ed.photos.splice(i,1)[0];S.ed.photos.unshift(p);ch();photos()}
function delP(i){S.ed.photos.splice(i,1);ch();photos()}
function shrink(f,mx){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var r=Math.min(1,(mx||1600)/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.85))};im.onerror=function(){rej(new Error(f.name+" bukan gambar yang valid"))};im.src=u})}
function upl(files){
  var list=Array.prototype.slice.call(files),n=0,slug=(S.ed.name||"villa").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"villa";
  (function next(){
    if(!list.length){toast(n+" foto diunggah. Klik Simpan villa untuk menayangkannya.");return}
    var f=list.shift();toast("Mengunggah "+f.name+"…");
    shrink(f).then(function(d){
      var name="foto/"+slug+"-"+Date.now().toString(36)+n+".jpg";
      return api("/contents/"+name,{method:"PUT",body:{message:"Tambah foto via panel admin",content:d.split(",")[1]}}).then(function(){S.prev[name]=d;S.ed.photos.push({image:name,caption:""});n++;ch();photos()})
    }).then(next).catch(function(e){toast(errMsg(e),1);next()})
  })()
}
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function ymd(y,m,d){return y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2)}
function todayS(){var t=new Date();return ymd(t.getFullYear(),t.getMonth(),t.getDate())}
function calRender(){
  var c=$("#cal");if(!c)return;var e=S.ed;e.booked=e.booked||[];
  if(S.cy==null){var t=new Date();S.cy=t.getFullYear();S.cm=t.getMonth()}
  var y=S.cy,m=S.cm,first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),td=todayS(),h="";
  ["Sen","Sel","Rab","Kam","Jum","Sab","Min"].forEach(function(w){h+='<div class="w">'+w+'</div>'});
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var d=1;d<=days;d++){var k=ymd(y,m,d),full=e.booked.indexOf(k)>=0;
    h+='<button type="button" class="'+(full?"full ":"")+(k<td?"past":"")+'" aria-pressed="'+full+'" aria-label="'+d+' '+BLN[m]+' '+y+(full?', penuh':', kosong')+'" onclick="calTog(\''+k+'\')">'+d+'</button>'}
  var n=e.booked.filter(function(k){return k>=td}).length;
  c.innerHTML='<div class="calh"><button type="button" class="btn ghost sm" onclick="calNav(-1)" aria-label="Bulan sebelumnya">←</button><b>'+BLN[m]+' '+y+'</b><button type="button" class="btn ghost sm" onclick="calNav(1)" aria-label="Bulan berikutnya">→</button></div><div class="calg">'+h+'</div>'+
  '<div class="calleg"><span>Kosong</span><span class="f">Penuh</span><span>'+n+' tanggal penuh ke depan</span></div>'+
  '<div class="pb" style="margin-top:12px"><button type="button" class="btn ghost sm" onclick="calClear()">Kosongkan bulan ini</button></div>'
}
function calNav(d){S.cm+=d;if(S.cm<0){S.cm=11;S.cy--}if(S.cm>11){S.cm=0;S.cy++}calRender()}
function calTog(k){var b=S.ed.booked=S.ed.booked||[],i=b.indexOf(k);if(i>=0)b.splice(i,1);else b.push(k);ch();calRender()}
function calClear(){var p=S.cy+"-"+("0"+(S.cm+1)).slice(-2)+"-";S.ed.booked=(S.ed.booked||[]).filter(function(k){return k.indexOf(p)!==0});ch();calRender()}
function saveV(){
  var e=S.ed;
  if(!e.name.trim()||!e.category.trim()){toast("Nama dan kategori wajib diisi.",1);return}
  var old=S.villas.slice(),copy=JSON.parse(JSON.stringify(e));copy.name=copy.name.trim();copy.category=copy.category.trim();copy.prices=(copy.prices||[]).map(function(x){return{label:String(x.label||"").trim(),price:+x.price||0}}).filter(function(x){return x.label&&x.price>0});var _t=todayS();copy.booked=(copy.booked||[]).filter(function(k,i,r){return /^\d{4}-\d{2}-\d{2}$/.test(k)&&k>=_t&&r.indexOf(k)===i}).sort();copy.price=copy.prices.length?Math.min.apply(null,copy.prices.map(function(x){return x.price})):0;
  if(S.idx<0){S.villas.push(copy);S.idx=S.villas.length-1}else S.villas[S.idx]=copy;
  var b=$("#sv");b.disabled=true;b.textContent="Menyimpan…";
  saveVillas().then(function(){S.dirty=false;toast("Tersimpan. Perubahan tampil di website sekitar 1 menit.");S.view="villas";render()}).catch(function(x){S.villas=old;b.disabled=false;b.textContent="Simpan villa";toast(errMsg(x),1)})
}

/* pengaturan */
function vSettings(){
  var h='<div class="top"><div><h1>Pengaturan Website</h1><p class="sub">Teks umum website. Label biru di setiap kolom menunjukkan bagian website yang berubah.</p></div></div>';
  GROUPS.forEach(function(g){
    h+='<div class="card"><h2>'+esc(g.t)+'</h2><p class="d">'+esc(g.d)+'</p>';
    g.f.forEach(function(f){
      if(f.img){h+=imgField(f);return}
      h+='<div class="f"><label for="s_'+f.k+'">'+esc(f.l)+'<span class="w">'+esc(f.w)+'</span></label><p class="h">'+esc(f.h)+'</p>'+
      (f.long?'<textarea id="s_'+f.k+'" oninput="S.set.'+f.k+'=this.value;ch()">'+esc(S.set[f.k])+'</textarea>':'<input type="text" id="s_'+f.k+'" value="'+esc(S.set[f.k])+'" oninput="S.set.'+f.k+'=this.value;ch()">')+'</div>'
    });
    h+='</div>'
  });
  return h+'<div class="bar"><span class="n">Perubahan baru tampil di website sekitar 1 menit setelah disimpan.</span><button class="btn" id="ss" onclick="saveS()">Simpan pengaturan</button></div>'
}
function imgField(f){
  var v=S.set[f.k]||"";
  return '<div class="f"><label>'+esc(f.l)+'<span class="w">'+esc(f.w)+'</span></label><p class="h">'+esc(f.h)+'</p>'+
  (v?'<img class="himg" alt="" '+(f.bg?'style="background:'+f.bg+';padding:16px;max-width:260px;object-fit:contain" ':'')+'src="'+esc(S.prev[v]||("../"+v))+'">':'<div class="empty" style="padding:22px">'+esc(f.empty||"Belum ada foto. Banner memakai warna coklat bawaan.")+'</div>')+
  '<div class="pb" style="margin-top:10px"><label class="btn ghost sm" style="cursor:pointer">'+(v?(f.up?"Ganti logo":"Ganti foto"):(f.up?"Pilih logo":"Pilih foto"))+'<input type="file" accept="image/*" hidden onchange="'+(f.up||"upHero")+'(this.files[0]);this.value=\'\'"></label>'+(v?'<button class="btn danger sm" onclick="S.set.'+f.k+'=\'\';ch();refSet()">Hapus foto</button>':'')+'</div></div>'
}
function refSet(){$("#main").innerHTML=vSettings()}
function upHero(f){
  if(!f)return;toast("Mengunggah foto banner…");
  shrink(f,1920).then(function(d){
    var name="foto/banner-"+Date.now().toString(36)+".jpg";
    return api("/contents/"+name,{method:"PUT",body:{message:"Tambah foto banner via panel admin",content:d.split(",")[1]}}).then(function(){S.prev[name]=d;S.set.hero_image=name;ch();refSet();toast("Foto diunggah. Klik Simpan pengaturan untuk menayangkannya.")})
  }).catch(function(e){toast(errMsg(e),1)})
}
function pngShrink(f,mx){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var r=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/png"))};im.onerror=function(){rej(new Error(f.name+" bukan gambar yang valid"))};im.src=u})}
function upLogo(f){
  if(!f)return;toast("Mengunggah logo…");
  pngShrink(f,900).then(function(d){
    var name="foto/logo-"+Date.now().toString(36)+".png";
    return api("/contents/"+name,{method:"PUT",body:{message:"Tambah logo via panel admin",content:d.split(",")[1]}}).then(function(){S.prev[name]=d;S.set.about_logo=name;ch();refSet();toast("Logo diunggah. Klik Simpan pengaturan untuk menayangkannya.")})
  }).catch(function(e){toast(errMsg(e),1)})
}
function saveS(){
  S.set.wa=String(S.set.wa||"").replace(/\D/g,"");
  if(!/^\d{8,15}$/.test(S.set.wa)){toast("Nomor WhatsApp tidak valid. Contoh: 6281234567890.",1);return}
  var b=$("#ss");b.disabled=true;b.textContent="Menyimpan…";
  put("data/settings.json",JSON.stringify(S.set,null,2)+"\n",S.shaS,"Update pengaturan via panel admin").then(function(s){S.shaS=s;S.dirty=false;toast("Pengaturan tersimpan. Tampil di website sekitar 1 menit.");render()}).catch(function(e){b.disabled=false;b.textContent="Simpan pengaturan";toast(errMsg(e),1)})
}

/* bantuan */
function vHelp(){
  return '<div class="top"><div><h1>Bantuan</h1><p class="sub">Cara kerja panel ini dan di mana tiap isian tampil di website.</p></div></div>'+
  '<div class="card help"><h2>Cara kerja</h2><ol><li>Ubah isi di panel ini, lalu klik <b>Simpan</b>.</li><li>Panel menyimpan perubahan langsung ke repository GitHub website Anda.</li><li>Website diperbarui otomatis. Tunggu sekitar 1 menit, lalu muat ulang website (Ctrl + F5).</li></ol></div>'+
  '<div class="card help"><h2>Menu panel</h2><ul><li><b>Daftar Villa</b>: tambah, ubah, dan hapus villa beserta foto dan fasilitasnya.</li><li><b>Pengaturan Website</b>: nama, judul besar, bagian Tentang, WhatsApp, dan email.</li></ul></div>'+
  '<div class="card help"><h2>Tips</h2><ul><li>Kategori baru otomatis menjadi tombol filter di website.</li><li>Foto pertama di tiap villa menjadi foto sampul.</li><li>Foto yang diunggah otomatis dikecilkan agar website cepat.</li><li>Foto yang dihapus dari villa tidak tampil lagi di website, tetapi filenya masih tersimpan di folder foto pada repository.</li><li>Jangan bagikan token. Kalau token bocor, hapus di GitHub dan buat yang baru.</li></ul></div>'
}

/* mulai */
(function(){
  var t="",u="";try{t=localStorage.getItem("vtok")||sessionStorage.getItem("vtok")||"";u=localStorage.getItem("vusr")||sessionStorage.getItem("vusr")||""}catch(e){}
  if(t&&u){$("#usr").value=u;$("#tok").value=t;connect(true)}
})();
</script>
